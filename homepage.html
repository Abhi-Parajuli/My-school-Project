<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Bhanudaya Secondary School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --ink:#0f1923; --ink-soft:#4a5568; --ink-mute:#94a3b8;
      --gold:#c9a84c; --gold-lt:#f0d98a;
      --surface:#faf9f7; --white:#ffffff; --border:#e8e4dc;
      --shadow:0 4px 24px rgba(15,25,35,0.08);
      --shadow-lg:0 12px 48px rgba(15,25,35,0.14);
    }
    body { font-family:'DM Sans',sans-serif; background:var(--surface); color:var(--ink); min-height:100vh; }

    .navbar { position:sticky; top:0; z-index:100; background:var(--ink); padding:0 48px; display:flex; align-items:center; justify-content:space-between; height:64px; box-shadow:0 2px 20px rgba(0,0,0,0.3); }
    .navbar-brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .navbar-brand img { width:36px; height:36px; object-fit:contain; }
    .navbar-brand span { font-family:'Playfair Display',serif; color:var(--white); font-size:16px; font-weight:600; }
    .nav-links { display:flex; gap:4px; align-items:center; }
    .nav-links a { color:rgba(255,255,255,0.7); text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; font-weight:500; transition:all 0.2s; }
    .nav-links a:hover { color:var(--white); background:rgba(255,255,255,0.1); }

    .profile-wrapper {
      display:flex; align-items:center; justify-content:center;
      min-height: calc(100vh - 64px);
      padding: 48px 20px;
    }
    .profile-card {
      background: var(--white); border:1px solid var(--border);
      border-radius: 24px; padding: 56px 48px; text-align:center;
      max-width: 480px; width:100%;
      box-shadow: var(--shadow-lg);
      animation: cardIn 0.6s cubic-bezier(0.34,1.3,0.64,1) forwards;
    }
    @keyframes cardIn {
      from { opacity:0; transform:scale(0.92) translateY(24px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }

    .avatar-ring {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #a07830);
      display: flex; align-items:center; justify-content:center;
      margin: 0 auto 24px;
      font-family:'Playfair Display',serif;
      font-size:36px; font-weight:700; color:var(--white);
      box-shadow: 0 8px 24px rgba(201,168,76,0.4);
    }

    .welcome-label {
      display: inline-flex; align-items:center; gap:8px;
      background: rgba(201,168,76,0.1); border:1px solid rgba(201,168,76,0.25);
      color:var(--gold); font-size:12px; font-weight:700;
      letter-spacing:0.1em; text-transform:uppercase;
      padding:5px 14px; border-radius:20px; margin-bottom:16px;
    }

    .profile-card h1 {
      font-family:'Playfair Display',serif;
      font-size:32px; color:var(--ink); margin-bottom:8px;
    }
    .profile-card h1 span { color:var(--gold); }
    .profile-email {
      font-size:14px; color:var(--ink-mute); margin-bottom:40px;
    }

    .profile-info {
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:24px; margin-bottom:32px; text-align:left;
    }
    .info-row {
      display:flex; align-items:center; gap:14px;
      padding:12px 0; border-bottom:1px solid var(--border);
    }
    .info-row:last-child { border-bottom:none; padding-bottom:0; }
    .info-row:first-child { padding-top:0; }
    .info-icon { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--ink),#1e3a5f); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .info-icon i { color:var(--gold); font-size:14px; }
    .info-label { font-size:11px; font-weight:700; color:var(--ink-mute); text-transform:uppercase; letter-spacing:0.06em; }
    .info-value { font-size:14px; font-weight:600; color:var(--ink); margin-top:1px; }

    .btn-logout {
      display:inline-flex; align-items:center; gap:10px;
      padding:13px 32px; background:var(--ink); color:var(--white);
      border:none; border-radius:10px; font-size:15px; font-weight:700;
      cursor:pointer; transition:all 0.25s; font-family:'DM Sans',sans-serif;
      text-decoration:none; width:100%; justify-content:center;
    }
    .btn-logout:hover { background:#dc2626; transform:translateY(-1px); }

    @media(max-width:768px) {
      .navbar { padding:0 20px; }
      .navbar-brand span { display:none; }
      .profile-card { padding:36px 24px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <img src="photo/hat.png" alt="logo">
    <span>Bhanudaya School</span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="course.html">Course</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<div class="profile-wrapper">
  <div class="profile-card">
    <div class="avatar-ring" id="avatarInitials">?</div>
    <div class="welcome-label"><i class="fa fa-star"></i> Member</div>
    <h1>Hello, <span id="userName">...</span></h1>
    <p class="profile-email" id="userEmail">Loading...</p>

    <div class="profile-info">
      <div class="info-row">
        <div class="info-icon"><i class="fa fa-user"></i></div>
        <div>
          <div class="info-label">Full Name</div>
          <div class="info-value" id="infoName">—</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon"><i class="fa fa-envelope"></i></div>
        <div>
          <div class="info-label">Email Address</div>
          <div class="info-value" id="infoEmail">—</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon"><i class="fa fa-shield-alt"></i></div>
        <div>
          <div class="info-label">Account Status</div>
          <div class="info-value" style="color:#16a34a"><i class="fa fa-check-circle"></i> Verified Member</div>
        </div>
      </div>
    </div>

    <button class="btn-logout" onclick="logout()">
      <i class="fa fa-sign-out-alt"></i> Sign Out
    </button>
  </div>
</div>

<script src="js/navbar.js"></script>
<script>
  const fullName = localStorage.getItem("fullName");
  const email    = localStorage.getItem("email");

  if (!fullName) {
    window.location.href = "contact.html";
  } else {
    const firstName = fullName.split(" ")[0];
    const initials  = fullName.split(" ").map(n => n[0]).join("").toUpperCase().slice(0,2);

    document.getElementById("avatarInitials").textContent = initials;
    document.getElementById("userName").textContent       = firstName;
    document.getElementById("userEmail").textContent      = email || "";
    document.getElementById("infoName").textContent       = fullName;
    document.getElementById("infoEmail").textContent      = email || "";
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("fullName");
    localStorage.removeItem("email");
    window.location.href = "contact.html";
  }
</script>
</body>
</html>
